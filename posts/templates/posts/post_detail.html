{% extends "base.html" %}

{% block content %}
    <h2>{{ post.title }}</h2>
    <p>{{ post.body }}</p>
    {% if post.author.pk == request.user.pk %}
    <a href="{% url 'post_edit' post.pk %}">Edit Post</a>
    <a href="{% url 'post_delete' post.pk %}">Delete Post</a>
    {% endif %}
    <a href="{% url 'post_list' %}">All Posts</a>
    {% endblock content %}
